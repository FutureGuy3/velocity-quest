<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velocity Quest</title>
<meta name="description" content="競泳スプリントのためのトレーニング記録">
<meta name="theme-color" content="#0B0B0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VQ">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/components.css">
<script src="./js/version.js"></script>
<script type="module" src="./js/app.js"></script>
</head>
<body>
<main id="app"><p class="empty">読み込み中…</p></main>
<nav id="nav" class="bottom-nav" aria-label="メイン"></nav>
<noscript><p class="empty">JavaScript を有効にしてください。</p></noscript>
<script>
// 起動の見張り(モジュールではない普通のスクリプト)。
// 古い部品と新しい部品が混ざってアプリが起動できないときでも、
// 1) この場所のオフライン用のしくみ(Service Worker)の登録だけは行い、入れ替わったら読み込み直す
// 2) 10秒たっても起動しなければ、どこで止まったかと、更新用ページへのボタンを出す
(function () {
  window.__vqErrors = [];
  var keep = function (m) { if (m && window.__vqErrors.length < 6) window.__vqErrors.push(String(m).slice(0, 200)); };
  window.addEventListener('error', function (e) {
    keep(e.message || ('読み込みに失敗: ' + ((e.target && (e.target.src || e.target.href)) || '')));
  }, true);
  window.addEventListener('unhandledrejection', function (e) { keep(e.reason && (e.reason.message || e.reason)); });
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    var had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(function (e) { keep('しくみの登録: ' + e.message); });
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (had && !window.__vqBooted && !window.__vqReloading) { window.__vqReloading = true; location.reload(); }
    });
  }
  var esc = function (t) { return String(t).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
  setTimeout(function () {
    if (window.__vqBooted) return;
    var ctrl = (navigator.serviceWorker && navigator.serviceWorker.controller) ? navigator.serviceWorker.controller.scriptURL.replace(location.origin, '') : 'なし';
    var app = document.getElementById('app');
    app.innerHTML = '<div class="empty" style="display:flex;flex-direction:column;gap:12px;text-align:left">'
      + '<p>アプリを起動できませんでした。</p>'
      + '<div class="card" style="font-size:12px;color:var(--text-2);word-break:break-all">'
      + '<p><b>止まった段階</b>:' + esc(window.__vqStage || 'アプリの部品を読み込めていません') + '</p>'
      + '<p><b>エラー</b>:' + esc(window.__vqErrors.join(' / ') || 'なし') + '</p>'
      + '<p><b>版</b>:' + esc(self.VQ_VERSION || '?') + ' / <b>しくみ</b>:' + esc(ctrl) + '</p>'
      + '</div>'
      + ((window.__vqStage || '').indexOf('記録の保存場所を開いて') === 0 && location.pathname.indexOf('/preview/') >= 0
        ? '<p style="font-size:12px">テスト版の記録の保存場所が開けません。更新用ページの「テスト版の記録を消して作り直す」で直せます(本番の記録は消えません)。</p>' : '')
      + '<p style="font-size:12px">この画面のスクリーンショットを送ってください。</p>'
      + '<a class="btn btn-primary btn-block" href="./update.html?v=' + Date.now() + '">更新用ページを開く(記録は消えません)</a>'
      + '<button class="btn btn-ghost btn-block" type="button" onclick="location.reload()">もう一度読み込む</button></div>';
  }, 10000);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ホーム</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#0B0B0C}
a{color:#FF8A4C}a:hover{color:#FFB08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B0B0C; color: #F4F4F5; font-family: 'Noto Sans JP', sans-serif">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.08em; color: {{accent}}">VELOCITY QUEST</span>
<span style="font-size: 12px; color: #A1A1AA">11月8日(日)</span>
</div>
<button aria-label="設定" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #2A2A2E; background: #161618; color: #F4F4F5; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
</button>
</header>

<section aria-label="目標" style="margin: 0 16px; padding: 16px 18px; border-radius: 18px; background: {{accent}}; color: #0B0B0C; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em">目標|長水路 50m自由形</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="上部に固定中"><path d="M12 17v5"></path><path d="M9 10.76V6h6v4.76l2 3.24H7z"></path><path d="M8 6h8"></path></svg>
</div>
<div style="display: flex; align-items: baseline; gap: 8px">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 52px; line-height: 0.9">30.00</span>
<span style="font-size: 16px; font-weight: 700">切り</span>
</div>
<div style="height: 6px; border-radius: 3px; background: rgba(11,11,12,0.22); overflow: hidden">
<div style="width: 72%; height: 100%; background: #0B0B0C; border-radius: 3px"></div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 11px; font-weight: 500">ベスト</span>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px">30.42</span>
</div>
<div style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 11px; font-weight: 500">あと</span>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px">0.42秒</span>
</div>
<div style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 11px; font-weight: 500">期限まで</span>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px">112日</span>
</div>
</div>
</section>

<section aria-label="今日の体重" style="margin: 14px 16px 0; padding: 14px 16px; border-radius: 16px; background: #161618; border: 1px solid #2A2A2E; display: flex; align-items: center; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
<label for="bw" style="font-size: 12px; color: #A1A1AA">今日の体重</label>
<div style="display: flex; align-items: baseline; gap: 6px">
<input id="bw" value="68.0" inputmode="decimal" style="width: 84px; background: transparent; border: none; border-bottom: 2px solid {{accent}}; color: #F4F4F5; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 32px; padding: 0; outline: none">
<span style="font-size: 14px; color: #A1A1AA">kg</span>
<span style="font-size: 12px; color: #A1A1AA; margin-left: 6px">前回 68.4(11/5)</span>
</div>
</div>
<button style="height: 44px; padding: 0 18px; border-radius: 12px; border: none; background: #F4F4F5; color: #0B0B0C; font-family: 'Noto Sans JP', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer">記録</button>
</section>

<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 22px 20px 10px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">ルーティン</h2>
<a href="Picker.dc.html" style="font-size: 13px; color: {{accent}}; text-decoration: none; font-weight: 500">+ 新規作成</a>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 0 16px">
<sc-for list="{{routines}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 16px; border-radius: 16px; background: #161618; border: 1px solid #2A2A2E">
<div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0">
<span style="font-size: 15px; font-weight: 700">{{r.name}}</span>
<span style="font-size: 12px; color: #A1A1AA">{{r.meta}}</span>
</div>
<a href="Workout.dc.html" aria-label="開始" style="width: 48px; height: 48px; border-radius: 14px; background: {{accent}}; color: #0B0B0C; display: flex; align-items: center; justify-content: center; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.52.85l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z"></path></svg>
</a>
</div>
</sc-for>
<button style="height: 48px; border-radius: 14px; border: 1px dashed #3A3A40; background: transparent; color: #D4D4D8; font-family: 'Noto Sans JP', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer">ルーティンなしで開始</button>
</div>

<nav aria-label="メイン" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding: 8px 12px 24px; box-sizing: border-box; background: #111113; border-top: 1px solid #222226; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{accent}}; font-size: 11px; font-weight: 700">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>ホーム</a>
<a href="Workout.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #A1A1AA; font-size: 11px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11"></path><path d="M17.5 6.5v11"></path><path d="M3 9v6"></path><path d="M21 9v6"></path><path d="M6.5 12h11"></path></svg>トレーニング</a>
<a href="Metrics.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #A1A1AA; font-size: 11px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="m7 15 4-4 3 3 6-7"></path></svg>指標</a>
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #A1A1AA; font-size: 11px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 9h18"></path><path d="M8 2v4"></path><path d="M16 2v4"></path></svg>履歴</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF6A1A","options":["#FF6A1A","#FFB020","#3DDC97","#4DA3FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
accent: this.props.accent ?? '#FF6A1A',
routines: [
{ name: '下半身・パワー', meta: '9種目 · 前回 11/5' },
{ name: '上半身・プル&プッシュ', meta: '9種目 · 前回 11/3' },
{ name: 'プライオ+PAP', meta: '6種目 · 前回 10/31' }
]
};
}
}
</script>
</body>
</html>
